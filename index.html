<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>benoitlepottier — Design Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <nav>
    <a href="index.html" class="nav-mark">benoit lepottier</a>
    <div class="nav-links">
      <a href="index.html">projects</a>
      <a href="about.html">about</a>
    </div>
  </nav>
</header>

<section class="work" id="work">
  <div class="index-shell">
    <div class="index-list" id="indexList"></div>

    <div class="preview-frame" id="previewFrame">
      <div class="preview-line"></div>
    </div>
  </div>
</section>

<script src="projects.js"></script>
<script>
  const listEl = document.getElementById('indexList');
  const previewFrame = document.getElementById('previewFrame');

  // Build the index list rows from projects.js
  listEl.innerHTML = PROJECTS.map(p => `
    <a class="index-item" href="${p.page}" data-id="${p.id}">
      <span class="index-name">${p.title}</span>
    </a>
  `).join('');

  // Build one preview <img> per project. We'll size and position them via CSS
  PROJECTS.forEach(p => {
    const img = document.createElement('img');
    img.src = p.cover;
    img.className = 'preview-img';
    img.dataset.id = p.id;
    img.alt = p.title;

    // initial transform values (centered, no offset). We'll set random values on hover.
    img.style.opacity = 0;
    img.style.transition = 'opacity 0.35s ease';

    previewFrame.appendChild(img);
  });

  const images = document.querySelectorAll('.preview-img');
  const items = document.querySelectorAll('.index-item');

  function randomBetween(min, max) {
    return Math.random() * (max - min) + min;
  }

  function positionPreviewFrame() {
    // Align the top of the box with the top of the index list
    const rect = listEl.getBoundingClientRect();
    // use the distance from the viewport top
    previewFrame.style.top = `${Math.max( rect.top, 10)}px`;
  }

  // Set initial positioning and update on resize/scroll
  positionPreviewFrame();
  window.addEventListener('resize', positionPreviewFrame);
  window.addEventListener('scroll', positionPreviewFrame, { passive: true });

  items.forEach(item => {
    item.addEventListener('mouseenter', () => {
      const id = item.getAttribute('data-id');
      images.forEach(img => {
        const isActive = img.dataset.id === id;
        img.classList.toggle('active', isActive);

        if (isActive) {
          // choose a small random rotation between -5 and 5 degrees
          const angle = randomBetween(-5, 5).toFixed(1); // deg
          const offsetX = Math.round(randomBetween(-12, 12));
          const offsetY = Math.round(randomBetween(-12, 12));
          // set transform immediately (no transform transition)
          img.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px)) rotate(${angle}deg)`;
          img.style.opacity = 1;
        } else {
          // hide non-active images
          img.style.opacity = 0;
        }
      });
    });
  });

  listEl.addEventListener('mouseleave', () => {
    images.forEach(img => {
      img.classList.remove('active');
      img.style.opacity = 0;
    });
  });

  // Recalculate frame position after images load (in case fonts/layout shift)
  window.addEventListener('load', positionPreviewFrame);
</script>

</body>
</html>
